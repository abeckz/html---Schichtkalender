<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BASF Schichtkalender</title>
    <script>
      // Anzeige (Hell/Dunkel) sofort setzen, damit beim Öffnen der Datei
      // kein heller Blitz entsteht. Fehler dürfen die App nie blockieren.
      (function () {
        try {
          var stored = window.localStorage.getItem('schichtkalender.theme');
          // Test-/Vorschauhilfe: ?theme=dark bzw. ?theme=light erzwingt eine
          // Anzeige, ohne die gespeicherte Einstellung zu verändern.
          var forced = /(?:^|[?&])theme=(dark|light)(?:&|$)/.exec(window.location.search);
          if (forced) stored = forced[1];
          var wantsDark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', wantsDark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
